<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>年会大屏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Hallmark · genre: atmospheric · macrostructure: Marquee Hero · theme: Lumen (Night Foundry)
     * tone: luxury · nav: N9 · footer: none · enrichment: none
     * pre-emit critique: P5 H5 E4 S4 R4 V5
     */
    :root {
      --font-display: "Noto Serif SC", ui-serif, Georgia, serif;
      --font-body: "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --dur: 220ms;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; overflow-x: clip; }
    body { font-family: var(--font-body); }
    #app { width: 100vw; height: 100vh; position: relative; }
    .brand {
      position: absolute; top: 2.8vh; left: 3vw; z-index: 12;
      max-width: min(46vw, 560px);
      font-family: var(--font-display); font-style: normal; font-weight: 400;
      font-size: clamp(1.35rem, 2.6vw, 2.1rem);
      letter-spacing: 0.04em; line-height: 1.25;
      opacity: 0.95;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hidden { display: none !important; }
    .screen-build {
      position: fixed; left: 12px; bottom: 10px; z-index: 29;
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.42); pointer-events: none; user-select: none;
    }

    /* —— 签到墙：典礼朱红（纯 CSS 高清底 + 可见烟花） —— */
    .mode-checkin {
      --paper: oklch(28% 0.09 25);
      --paper-2: oklch(22% 0.08 25);
      --ink: oklch(96% 0.02 85);
      --gold: oklch(84% 0.1 85);
      --accent: oklch(72% 0.16 55);
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, oklch(80% 0.15 75 / 0.28), transparent 20%),
        radial-gradient(circle at 78% 4%, oklch(84% 0.13 82 / 0.22), transparent 18%),
        radial-gradient(circle at 52% 72%, oklch(48% 0.19 28 / 0.22), transparent 42%),
        repeating-radial-gradient(circle at 50% 108%, transparent 0 23px, oklch(72% 0.12 35 / 0.11) 24px 26px, transparent 27px 46px),
        linear-gradient(145deg, #b20f16 0%, #8d0710 47%, #5d050b 100%);
    }
    /* 烟花层：低于标题/灯笼/弹幕，不抢交互 */
    .fx-fireworks {
      display: none;
      position: absolute; inset: 0; z-index: 1;
      pointer-events: none; overflow: hidden;
    }
    .mode-checkin .fx-fireworks { display: block; }
    .fw {
      position: absolute;
      width: 14px; height: 14px; border-radius: 50%;
      opacity: 0;
      background: radial-gradient(circle, oklch(92% 0.08 90) 0%, oklch(78% 0.12 75 / 0.55) 35%, transparent 70%);
      box-shadow:
        0 0 0 1px oklch(90% 0.06 85 / 0.15),
        0 0 18px oklch(80% 0.1 80 / 0.35);
      animation: fwBloom 4.8s var(--ease-out) infinite;
      transform-origin: center;
    }
    .fw::before, .fw::after {
      content: '';
      position: absolute; inset: -48px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 0%, oklch(90% 0.08 85 / 0.55) 0 1.5px, transparent 2px),
        radial-gradient(circle at 85% 25%, oklch(88% 0.07 80 / 0.5) 0 1.2px, transparent 2px),
        radial-gradient(circle at 100% 50%, oklch(92% 0.06 90 / 0.45) 0 1.4px, transparent 2px),
        radial-gradient(circle at 85% 75%, oklch(86% 0.08 75 / 0.45) 0 1.2px, transparent 2px),
        radial-gradient(circle at 50% 100%, oklch(90% 0.07 85 / 0.5) 0 1.5px, transparent 2px),
        radial-gradient(circle at 15% 75%, oklch(88% 0.06 80 / 0.4) 0 1.2px, transparent 2px),
        radial-gradient(circle at 0% 50%, oklch(92% 0.05 90 / 0.45) 0 1.4px, transparent 2px),
        radial-gradient(circle at 15% 25%, oklch(86% 0.08 75 / 0.4) 0 1.2px, transparent 2px);
      opacity: 0.7;
    }
    .fw::after { inset: -72px; opacity: 0.55; transform: rotate(22deg); }
    .fw1 { top: 7%; left: 12%; animation-delay: 0s; }
    .fw2 { top: 4%; left: 38%; animation-delay: 1.4s; width: 8px; height: 8px; }
    .fw3 { top: 9%; left: 62%; animation-delay: 2.6s; }
    .fw4 { top: 5%; left: 82%; animation-delay: 0.8s; width: 7px; height: 7px; }
    .fw5 { top: 14%; left: 48%; animation-delay: 3.8s; width: 6px; height: 6px; }
    .fw6 { top: 28%; left: 24%; animation-delay: 2.1s; width: 8px; height: 8px; }
    .fw7 { top: 24%; left: 72%; animation-delay: 4.1s; width: 9px; height: 9px; }
    .fw8 { top: 38%; left: 88%; animation-delay: 1.1s; width: 6px; height: 6px; }
    @keyframes fwBloom {
      0% { transform: scale(0.35); opacity: 0; }
      12% { opacity: 0.86; }
      30% { transform: scale(1.35); opacity: 0.64; }
      58% { transform: scale(1.72); opacity: 0.25; }
      100% { transform: scale(2.05); opacity: 0; }
    }
    .mode-checkin .checkin-title {
      position: absolute; top: 10vh; left: 0; right: 0; text-align: center; z-index: 5;
    }
    .mode-checkin .checkin-title .kicker {
      display: block; font-family: var(--font-mono); font-size: 12px;
      letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px;
    }
    .mode-checkin .checkin-title h1 {
      margin: 0; font-family: var(--font-display); font-style: normal; font-weight: 400;
      font-size: clamp(2.4rem, 5.2vw, 4.2rem); letter-spacing: 0.06em;
      color: var(--ink);
    }
    .mode-checkin .checkin-title h1 .mark {
      color: var(--accent);
      text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 10px;
    }
    .mode-checkin .checkin-title .sub {
      margin: 10px 0 0;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(255, 244, 230, 0.72);
    }
    .load-banner {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      max-width: min(92vw, 520px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(40, 18, 10, 0.88);
      border: 1px solid rgba(255, 180, 120, 0.35);
      color: #ffe8d2;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-align: center;
      display: none;
    }
    .load-banner.show { display: block; }
    .qr-box {
      position: absolute; top: 3.5vh; right: 3vw; z-index: 12;
      width: 168px; padding: 14px;
      background: oklch(98% 0.01 85 / 0.96);
      border: 1px solid oklch(84% 0.08 85);
      border-radius: 4px;
      color: oklch(25% 0.04 40);
      text-align: center;
      box-shadow: 0 18px 40px oklch(10% 0.04 25 / 0.35);
    }
    .qr-box img { width: 132px; height: 132px; display: block; margin: 0 auto 10px; }
    .qr-box img:not([src]) { background: linear-gradient(135deg, #fff, #f4eadc); }
    .qr-box.is-error img { display: none; }
    .qr-box.is-error::before {
      content: '小程序码暂不可用';
      display: grid; place-items: center; width: 132px; height: 132px; margin: 0 auto 10px;
      border: 1px dashed oklch(58% 0.08 35); color: oklch(42% 0.08 35);
      font-size: 12px; line-height: 1.5; padding: 12px;
    }
    .qr-box .t { font-size: 12px; line-height: 1.4; }
    .qr-box .code {
      margin-top: 6px; font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.12em; color: oklch(45% 0.05 40);
    }
    .lantern-stage {
      position: absolute; inset: 0; z-index: 4; overflow: hidden;
      pointer-events: none;
    }
    .lantern {
      position: absolute; bottom: -160px; width: 118px; text-align: center;
      will-change: transform, opacity;
      animation: lanternRise linear forwards;
    }
    .lantern img.base { width: 96px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 10px 18px oklch(20% 0.08 25 / 0.45)); }
    .lantern .av {
      width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
      border: 2px solid oklch(90% 0.06 85); position: absolute; left: 50%; top: 62px;
      transform: translateX(-50%); background: #fff;
    }
    .lantern .nm {
      margin-top: -4px; display: inline-block; max-width: 104px;
      padding: 3px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 600; color: oklch(28% 0.05 50);
      background: oklch(94% 0.05 85 / 0.92);
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    /* 自底部升至顶部后淡出消失 */
    @keyframes lanternRise {
      0% { transform: translate3d(0, 0, 0) scale(0.92); opacity: 0; }
      8% { opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translate3d(0, calc(-100vh - 200px), 0) scale(1.05); opacity: 0; }
    }

    /* 弹幕：JS 按 DM_SPEED=0.7 拉长动画时长 */
    .danmaku-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 15; }
    .dm {
      position: absolute; left: 0; display: flex; align-items: center; gap: 8px;
      padding: 6px 14px 6px 6px; border-radius: 999px; white-space: nowrap;
      background: linear-gradient(90deg, oklch(98% 0.01 85 / 0.95), oklch(90% 0.05 40 / 0.78));
      color: oklch(28% 0.04 40); font-size: 14px;
      box-shadow: 0 8px 24px oklch(15% 0.04 25 / 0.25);
      will-change: transform;
      animation: dmMove linear forwards;
    }
    .dm img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .dm b { font-weight: 600; }
    @keyframes dmMove {
      from { transform: translateX(100vw); }
      to { transform: translateX(-140%); }
    }

    /* —— 科技蓝抽奖（纯 CSS 高清底 + 光晶漂浮） —— */
    .mode-blue {
      --ink: oklch(94% 0.02 230);
      --accent: oklch(78% 0.12 220);
      color: var(--ink);
      background:
        radial-gradient(circle at 48% 16%, oklch(67% 0.19 234 / 0.22), transparent 24%),
        radial-gradient(circle at 14% 78%, oklch(55% 0.18 259 / 0.2), transparent 30%),
        radial-gradient(circle at 88% 70%, oklch(61% 0.17 218 / 0.17), transparent 28%),
        repeating-linear-gradient(118deg, transparent 0 64px, oklch(74% 0.09 230 / 0.035) 65px 66px),
        linear-gradient(145deg, #082b60 0%, #071a43 48%, #050d25 100%);
    }
    .fx-float {
      display: none;
      position: absolute; inset: 0; z-index: 1;
      pointer-events: none; overflow: hidden;
    }
    .mode-blue .fx-float,
    .mode-dark .fx-float { display: block; }
    .crystal {
      position: absolute;
      width: min(22vw, 260px); height: min(22vw, 260px);
      opacity: 0.58;
      background:
        radial-gradient(ellipse 40% 55% at 42% 38%, oklch(70% 0.08 230 / 0.55), transparent 70%),
        radial-gradient(ellipse 35% 45% at 62% 58%, oklch(55% 0.1 250 / 0.4), transparent 72%),
        radial-gradient(ellipse 28% 35% at 30% 70%, oklch(62% 0.07 220 / 0.35), transparent 70%);
      animation: crystalFloat 7.5s var(--ease-in-out, cubic-bezier(0.77, 0, 0.175, 1)) infinite;
      will-change: transform, opacity;
    }
    .crystal::after {
      content: '';
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: oklch(95% 0.02 230 / 0.85);
      box-shadow:
        18px 22px 0 -1px oklch(92% 0.03 230 / 0.55),
        40px 12px 0 -2px oklch(90% 0.04 220 / 0.4),
        8px 48px 0 -1px oklch(94% 0.02 240 / 0.5);
    }
    .crystal-tl { top: -2%; left: -1%; animation-delay: 0s; }
    .crystal-br {
      right: -2%; bottom: -4%; width: min(28vw, 320px); height: min(28vw, 320px);
      opacity: 0.62; animation-delay: -3.2s; animation-duration: 9s;
    }
    .crystal-tr {
      top: 8%; right: 8%; width: min(10vw, 120px); height: min(10vw, 120px);
      opacity: 0.4; animation-delay: -1.6s; animation-duration: 6.5s;
    }
    @keyframes crystalFloat {
      0%, 100% { transform: translate3d(-8px, 8px, 0) rotate(-2deg) scale(0.96); opacity: 0.42; }
      50% { transform: translate3d(14px, -24px, 0) rotate(3deg) scale(1.06); opacity: 0.72; }
    }
    .blue-title {
      position: absolute; top: 8vh; left: 0; right: 0; text-align: center; z-index: 5;
    }
    .blue-title .kicker {
      display: inline-block; margin-bottom: 12px; padding: 6px 14px;
      border: 1px solid oklch(70% 0.1 220 / 0.45); border-radius: 999px;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent);
    }
    .blue-title h1 {
      margin: 0; font-family: var(--font-display); font-style: normal; font-weight: 400;
      font-size: clamp(2.2rem, 4.6vw, 3.8rem); letter-spacing: 0.08em;
      text-shadow: 0 0 40px oklch(60% 0.14 230 / 0.35);
    }
    .prize-chip {
      position: absolute; top: 3.5vh; right: 3vw; z-index: 12;
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px 8px 8px; border-radius: 999px;
      background: oklch(16% 0.04 250 / 0.82);
      border: 1px solid oklch(55% 0.1 240 / 0.5);
      backdrop-filter: blur(10px);
    }
    .prize-chip img {
      width: 44px; height: 44px; border-radius: 10px; object-fit: cover;
      border: 1px solid oklch(70% 0.08 220 / 0.4);
    }
    .prize-chip .lvl { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.04em; }
    .prize-chip .nm { font-size: 12px; opacity: 0.75; margin-top: 2px; }
    .prize-chip .cnt {
      margin-left: 4px; padding: 4px 10px; border-radius: 999px;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
      background: oklch(40% 0.12 250 / 0.55);
    }
    .slots {
      position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
      display: flex; gap: clamp(16px, 2.4vw, 36px); z-index: 6;
    }
    .slot {
      width: min(16vw, 220px); height: min(24vw, 300px);
      background: url('./assets/box-glow.svg') center/contain no-repeat;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding-bottom: 8%;
    }
    .slot .face {
      width: 56%; aspect-ratio: 1; border-radius: 14px; object-fit: cover;
      border: 2px solid oklch(85% 0.06 220); background: oklch(18% 0.04 250);
      box-shadow: 0 0 24px oklch(60% 0.12 230 / 0.35);
    }
    .slot .spinning {
      font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4rem);
      color: var(--accent); text-shadow: 0 0 28px oklch(70% 0.14 220 / 0.6);
    }
    .slot .label {
      margin-top: 12px; text-align: center; font-size: clamp(12px, 1.05vw, 15px);
      line-height: 1.35; max-width: 90%;
    }
    .slot .label small { display: block; opacity: 0.65; font-size: 0.85em; margin-top: 2px; }

    /* —— 揭晓：沿用蓝底，保留金色文字 —— */
    .mode-dark {
      --gold: oklch(82% 0.1 85);
      --ink: oklch(96% 0.01 85);
      color: var(--gold);
      background:
        radial-gradient(circle at 50% 12%, oklch(65% 0.16 232 / 0.18), transparent 28%),
        radial-gradient(circle at 15% 80%, oklch(52% 0.15 258 / 0.16), transparent 30%),
        repeating-linear-gradient(118deg, transparent 0 64px, oklch(74% 0.09 230 / 0.03) 65px 66px),
        linear-gradient(145deg, #071d44 0%, #07122e 52%, #05091a 100%);
    }
    .dark-bg-avatars { position: absolute; inset: 0; overflow: hidden; opacity: 0.18; z-index: 1; }
    .dark-bg-avatars img {
      position: absolute; width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
      filter: grayscale(0.25);
    }
    .dark-head { position: absolute; top: 7vh; left: 0; right: 0; text-align: center; z-index: 5; }
    .dark-head h1 {
      margin: 0; font-family: var(--font-display); font-style: normal; font-weight: 400;
      font-size: clamp(2.6rem, 5.5vw, 4.5rem); letter-spacing: 0.18em;
      color: var(--gold);
    }
    .dark-head .sub {
      margin-top: 16px; display: inline-block; padding: 8px 28px;
      border-top: 1px solid oklch(70% 0.08 85 / 0.55);
      border-bottom: 1px solid oklch(70% 0.08 85 / 0.55);
      font-family: var(--font-mono); font-size: clamp(12px, 1.2vw, 15px);
      letter-spacing: 0.32em; text-transform: uppercase;
    }
    .winner-grid {
      position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%);
      display: flex; flex-wrap: wrap; gap: clamp(12px, 1.5vw, 22px);
      justify-content: center; width: min(88vw, 1180px); z-index: 6;
    }
    .wcard { width: min(12vw, 148px); text-align: center; }
    .wcard img {
      width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;
      border: 1px solid oklch(75% 0.08 85 / 0.7);
      box-shadow: 0 16px 40px oklch(5% 0.02 80 / 0.55);
      background: oklch(18% 0.02 80);
    }
    .wcard .n {
      margin-top: 10px; color: var(--ink); font-size: clamp(12px, 1.05vw, 15px); font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wcard .nn {
      color: oklch(72% 0.06 85); font-size: clamp(10px, 0.85vw, 12px);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mode-dark .prize-chip {
      border-color: oklch(70% 0.08 85 / 0.5);
      background: oklch(16% 0.03 80 / 0.85);
    }

    /* 控场条 */
    .ctrl {
      position: absolute; left: 50%; bottom: 3.2vh; transform: translateX(-50%);
      z-index: 30; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      padding: 8px; border-radius: 999px;
      background: oklch(8% 0.02 80 / 0.55);
      border: 1px solid oklch(70% 0.02 80 / 0.18);
      backdrop-filter: blur(14px);
    }
    .ctrl button, .ctrl select {
      border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
      font-family: var(--font-body); font-weight: 600; font-size: 13px;
      color: oklch(96% 0.01 80);
      background: oklch(35% 0.04 80 / 0.55);
      transition: transform var(--dur) var(--ease-out), background var(--dur) var(--ease-out);
    }
    .ctrl button:hover, .ctrl select:hover { background: oklch(45% 0.06 80 / 0.65); }
    .ctrl button:active { transform: translateY(1px); }
    .ctrl button:focus-visible, .ctrl select:focus-visible {
      outline: 2px solid oklch(78% 0.12 85); outline-offset: 2px;
    }
    .ctrl .primary {
      background: linear-gradient(90deg, oklch(62% 0.18 35), oklch(55% 0.16 290));
    }
    .ctrl select { appearance: none; padding-right: 28px; }
    .ctrl-hint {
      position: absolute; left: 50%; bottom: calc(3.2vh + 58px); transform: translateX(-50%);
      z-index: 30; font-size: 12px; letter-spacing: 0.04em;
      color: oklch(92% 0.02 80); background: oklch(8% 0.02 80 / 0.55);
      border: 1px solid oklch(70% 0.02 80 / 0.18); border-radius: 999px;
      padding: 6px 14px; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    @media (max-width: 768px) {
      .qr-box { width: 132px; padding: 10px; }
      .qr-box img { width: 100px; height: 100px; }
      .lantern { width: 88px; }
      .lantern img.base { width: 72px; }
      .ctrl { width: calc(100% - 24px); border-radius: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lantern { animation-duration: 18s !important; }
      .dm { animation-duration: 28s !important; }
      .fw { animation-duration: 12s !important; }
      .crystal { animation: crystalBreathe 14s ease-in-out infinite !important; }
    }
    @keyframes crystalBreathe {
      0%, 100% { transform: scale(0.98); opacity: 0.34; }
      50% { transform: scale(1.02); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="loadBanner" class="load-banner" role="status"></div>
  <div class="screen-build" title="用于核对云托管大屏版本">GALA_SCREEN 2026-11-23-fix-v13</div>
  <div id="app" class="mode-checkin">
    <div class="fx-fireworks" aria-hidden="true">
      <span class="fw fw1"></span>
      <span class="fw fw2"></span>
      <span class="fw fw3"></span>
      <span class="fw fw4"></span>
      <span class="fw fw5"></span>
      <span class="fw fw6"></span>
      <span class="fw fw7"></span>
      <span class="fw fw8"></span>
    </div>
    <div class="fx-float" aria-hidden="true">
      <span class="crystal crystal-tl"></span>
      <span class="crystal crystal-tr"></span>
      <span class="crystal crystal-br"></span>
    </div>
    <div class="brand" id="brand">正在连接场次…</div>

    <div id="panel-checkin">
      <div class="checkin-title">
        <span class="kicker" id="checkinKicker">当前奖项</span>
        <h1 id="checkinTitle">正在加载奖项…</h1>
        <p class="sub" id="checkinSub">扫码签到上墙</p>
      </div>
      <div class="qr-box">
        <img id="qrImg" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="签到小程序码" />
        <div class="t" id="qrHint">微信扫码参与本场</div>
        <div class="code" id="codeLabel"></div>
      </div>
      <div class="lantern-stage" id="lanternStage"></div>
    </div>

    <div id="panel-blue" class="hidden">
      <div class="blue-title">
        <div class="kicker" id="blueYear">Drawing</div>
        <h1 id="blueTitle">正在抽奖</h1>
      </div>
      <div class="prize-chip" id="blueChip">
        <img id="bluePrizeImg" src="./assets/prize-placeholder.svg" alt="" />
        <div>
          <div class="lvl" id="bluePrizeLevel">奖项</div>
          <div class="nm" id="bluePrizeName"></div>
        </div>
        <div class="cnt" id="blueRemain">抽 0</div>
      </div>
      <div class="slots" id="blueSlots"></div>
    </div>

    <div id="panel-dark" class="hidden">
      <div class="dark-bg-avatars" id="darkBg"></div>
      <div class="dark-head">
        <h1 id="darkTitle">恭喜中奖</h1>
        <div class="sub" id="darkSub">奖项</div>
      </div>
      <div class="prize-chip" id="darkChip">
        <img id="darkPrizeImg" src="./assets/prize-placeholder.svg" alt="" />
        <div>
          <div class="lvl" id="darkPrizeLevel">奖项</div>
          <div class="nm" id="darkPrizeName"></div>
        </div>
      </div>
      <div class="winner-grid" id="darkGrid"></div>
    </div>

    <div class="danmaku-layer" id="dmLayer"></div>

    <div class="ctrl-hint" id="ctrlHint">主办台与大屏均可开奖</div>
    <div class="ctrl" id="ctrl">
      <select id="roundSelect" aria-label="选择奖项"></select>
      <button type="button" id="btnCheckin">签到墙</button>
      <button type="button" class="primary" id="btnDraw">开始抽奖</button>
      <button type="button" id="btnRedraw">重新抽奖</button>
      <button type="button" id="btnResult">看结果</button>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search)
    const code = (qs.get('code') || '').toUpperCase()
    const screenToken = qs.get('token') || localStorage.getItem('gala_screen_token') || ''
    if (screenToken) localStorage.setItem('gala_screen_token', screenToken)
    ;(function rememberApi() {
      const a = (qs.get('api') || '').replace(/\/$/, '')
      if (a) try { localStorage.setItem('gala_api_origin', a) } catch (_) {}
    })()
    function resolveApiBase() {
      const fromQuery = (qs.get('api') || '').replace(/\/$/, '')
      if (fromQuery) {
        try { localStorage.setItem('gala_api_origin', fromQuery) } catch (_) {}
        return fromQuery + '/api/gala/v1'
      }
      // 线上同域托管：强制相对路径，避免旧 localStorage 指到 localhost 导致整页无数据
      const host = String(location.hostname || '')
      const isLocal = host === 'localhost' || host === '127.0.0.1' || host === ''
      if (!isLocal && (location.protocol === 'http:' || location.protocol === 'https:')) {
        try { localStorage.removeItem('gala_api_origin') } catch (_) {}
        return '/api/gala/v1'
      }
      let saved = ''
      try { saved = (localStorage.getItem('gala_api_origin') || '').replace(/\/$/, '') } catch (_) {}
      return saved ? saved + '/api/gala/v1' : '/api/gala/v1'
    }
    const API = resolveApiBase()
    let snap = null
    let spinning = false
    /** 大屏本地选中的轮次；避免轮询把下拉框打回服务端 currentRound */
    let selectedRoundId = null
    let qrObjectUrl = ''
    let qrRetryCount = 0
    /** 速度倍率：越小越慢（时长 = 基准 / factor） */
    const LANTERN_SPEED = 0.8
    const DM_SPEED = 0.7

    function authHeaders() {
      const h = {}
      if (screenToken) h.Authorization = 'Bearer ' + screenToken
      return h
    }

    /**
     * 公平轮播队列：优先最新未播；否则在本轮未播过的里随机，保证每人至少播过一遍后再重置。
     */
    function createFairCarousel(keyFn) {
      const byKey = new Map()
      const unseen = new Set()
      const roundBag = new Set()
      return {
        sync(list) {
          const incoming = list || []
          const seen = new Set()
          incoming.forEach((item) => {
            const k = keyFn(item)
            if (k == null || k === '') return
            seen.add(k)
            const prev = byKey.get(k)
            byKey.set(k, item)
            if (!prev) unseen.add(k)
          })
          // 不删旧人：签到墙要能循环历史嘉宾；弹幕同理保留已见过的条目
        },
        size() { return byKey.size },
        next() {
          if (!byKey.size) return null
          if (unseen.size) {
            let best = null
            let bestRank = -Infinity
            unseen.forEach((k) => {
              const item = byKey.get(k)
              const rank = Number(item && (item.id || item._rank)) || 0
              if (rank >= bestRank) { bestRank = rank; best = k }
            })
            if (best == null) best = [...unseen][0]
            unseen.delete(best)
            roundBag.add(best)
            return byKey.get(best)
          }
          const keys = [...byKey.keys()]
          let pool = keys.filter((k) => !roundBag.has(k))
          if (!pool.length) {
            roundBag.clear()
            pool = keys.slice()
          }
          const pick = pool[Math.floor(Math.random() * pool.length)]
          roundBag.add(pick)
          return byKey.get(pick)
        },
      }
    }

    const lanternQueue = createFairCarousel((p) => String(p.id || p.openid || p.nickName || ''))
    const danmakuQueue = createFairCarousel((d) => String(d.id))
    let lanternTimer = null
    let danmakuTimer = null
    let lanternInFlight = 0
    let danmakuInFlight = 0
    const MAX_LANTERNS = 8
    const MAX_DANMAKU = 10
    let dmLane = 0
    /** 屏上已出现的「同人同文」弹幕，避免重复飘 */
    const dmOnScreen = new Set()

    function dmFingerprint(d) {
      const name = String((d && d.nickName) || '').trim()
      const text = String(
        d && d.content != null ? d.content : ('签到上墙 · ' + ((d && d.realName) || name))
      ).trim()
      return name + '\0' + text
    }

    async function fetchSnap() {
      const res = await fetch(`${API}/screen/snapshot?code=${encodeURIComponent(code)}`)
      const json = await res.json()
      if (!res.ok || json.code) throw new Error(json.msg || '加载失败')
      snap = json.data
      return snap
    }

    function setMode(ui) {
      const app = document.getElementById('app')
      app.classList.remove('mode-checkin', 'mode-blue', 'mode-dark')
      document.getElementById('panel-checkin').classList.add('hidden')
      document.getElementById('panel-blue').classList.add('hidden')
      document.getElementById('panel-dark').classList.add('hidden')
      if (ui === 'checkin') {
        app.classList.add('mode-checkin')
        document.getElementById('panel-checkin').classList.remove('hidden')
      } else if (ui === 'blue') {
        app.classList.add('mode-blue')
        document.getElementById('panel-blue').classList.remove('hidden')
      } else {
        app.classList.add('mode-dark')
        document.getElementById('panel-dark').classList.remove('hidden')
      }
    }

    function prizeTitleOf(round) {
      const prize = round && round.prize
      return (prize && (prize.levelLabel || prize.name)) || '奖项'
    }

    function currentRound() {
      if (!snap) return null
      const rounds = snap.rounds || []
      if (selectedRoundId != null) {
        const hit = rounds.find((r) => String(r.id) === String(selectedRoundId))
        if (hit) return hit
      }
      const sel = document.getElementById('roundSelect') && document.getElementById('roundSelect').value
      if (sel) {
        const hit = rounds.find((r) => String(r.id) === String(sel))
        if (hit) return hit
      }
      return snap.currentRound || rounds[0] || null
    }

    function updateEventBrand() {
      const el = document.getElementById('brand')
      if (!el) return
      // 左上角：后台场次主题（event.title）
      const title = (snap && snap.event && snap.event.title) || '场次主题未设置'
      el.textContent = title
      el.title = title
    }

    function setLoadBanner(msg) {
      const el = document.getElementById('loadBanner')
      if (!el) return
      if (!msg) {
        el.classList.remove('show')
        el.textContent = ''
        return
      }
      el.textContent = msg
      el.classList.add('show')
    }

    function refreshDrawPanels() {
      if (spinning) return
      const round = currentRound()
      const winners = (snap && snap.winners) || []
      const forRound =
        snap && snap.currentRound && round && String(snap.currentRound.id) === String(round.id)
          ? winners
          : []
      const mode = (snap && snap.event && snap.event.screenMode) || 'checkin'
      if (mode === 'result' || mode === 'draw' || document.getElementById('app').classList.contains('mode-blue') || document.getElementById('app').classList.contains('mode-dark')) {
        if (forRound.length) showResult(forRound)
        else {
          const theme = (snap.event && snap.event.themeMode) === 'dark' || (round && round.winnerCount > 5) ? 'dark' : 'blue'
          if (theme === 'dark') {
            setMode('dark')
            renderDark([])
          } else {
            setMode('blue')
            renderBlueSlots([], false)
          }
        }
      }
    }

    function syncCtrlHint() {
      const ev = snap && snap.event
      const hint = document.getElementById('ctrlHint')
      const btnRedraw = document.getElementById('btnRedraw')
      if (!ev || !hint) return
      const bits = []
      if (ev.testMode) bits.push('测试模式 · 可反复抽')
      else bits.push('正式开奖')
      if (!ev.allowRedraw && !ev.testMode) bits.push('已禁止重抽')
      else bits.push('可重抽')
      if (ev.status === 'closed') bits.push('场次已关闭')
      bits.push('主办台也可控场')
      hint.textContent = bits.join(' · ')
      if (btnRedraw) btnRedraw.style.display = (!ev.allowRedraw && !ev.testMode) ? 'none' : ''
    }

    function renderRounds() {
      const sel = document.getElementById('roundSelect')
      const rounds = snap.rounds || []
      const prev = selectedRoundId != null ? String(selectedRoundId) : String(sel.value || '')
      sel.innerHTML = rounds.map((r) => {
        const label = (r.prize && (r.prize.levelLabel || r.prize.name)) || '未命名奖项'
        const name = (r.prize && r.prize.name && r.prize.levelLabel) ? ` · ${r.prize.name}` : ''
        const itemCount = (r.prize && r.prize.items && r.prize.items.length) || 0
        const items = itemCount ? ` · ${itemCount}件奖品` : ''
        return `<option value="${r.id}">${escapeHtml(label)}${escapeHtml(name)} · 抽${r.winnerCount}人${items}</option>`
      }).join('')
      if (!rounds.length) sel.innerHTML = '<option value="">请先在主办台新增奖项</option>'
      const stillValid = prev && rounds.some((r) => String(r.id) === prev)
      if (stillValid) {
        sel.value = prev
        selectedRoundId = Number(prev) || prev
      } else if (snap.currentRound) {
        sel.value = String(snap.currentRound.id)
        selectedRoundId = snap.currentRound.id
      } else if (rounds[0]) {
        sel.value = String(rounds[0].id)
        selectedRoundId = rounds[0].id
      }
      syncCtrlHint()
      updateEventBrand()
    }

    function renderCheckinMeta() {
      const round = currentRound()
      const prize = round && round.prize
      const level = prizeTitleOf(round)
      const prizeName = (prize && prize.name) || ''
      const items = (prize && prize.items) || []
      const itemNames = items.map((it) => it.name).filter(Boolean)
      const el = document.getElementById('checkinTitle')
      const kicker = document.getElementById('checkinKicker')
      const sub = document.getElementById('checkinSub')
      if (kicker) kicker.textContent = '当前奖项'
      // 中央主标题：奖项名称（levelLabel）；副标题展示奖品摘要
      if (el) el.textContent = round ? level : '请先配置奖项'
      if (sub) {
        if (itemNames.length > 1) sub.textContent = '奖品：' + itemNames.join(' / ')
        else if (prizeName && prizeName !== level) sub.textContent = '奖品：' + prizeName
        else sub.textContent = round ? '扫码签到上墙 · 准备开奖' : '请返回主办台新增至少一个奖项'
      }
      document.getElementById('codeLabel').textContent = '场次 ' + ((snap.event && snap.event.code) || code)
      ensureQr()
    }

    async function ensureQr(force) {
      const qr = document.getElementById('qrImg')
      const hint = document.getElementById('qrHint')
      const box = qr && qr.closest('.qr-box')
      if (!qr || !code) return
      if (!force && qr.dataset.ok === '1' && qr.getAttribute('src')) return
      if (qr.dataset.loading === '1') return
      qr.dataset.loading = '1'
      if (hint) hint.textContent = qrRetryCount ? '正在重新获取小程序码…' : '正在获取小程序码…'
      try {
        const url = `${API}/screen/qrcode?code=${encodeURIComponent(code)}&_=${Date.now()}`
        const res = await fetch(url)
        const type = String(res.headers.get('content-type') || '').toLowerCase()
        if (!res.ok || !type.includes('image/')) {
          const payload = await res.json().catch(() => ({}))
          throw new Error(payload.msg || `小程序码接口异常（HTTP ${res.status}）`)
        }
        const blob = await res.blob()
        if (qrObjectUrl) URL.revokeObjectURL(qrObjectUrl)
        qrObjectUrl = URL.createObjectURL(blob)
        qr.src = qrObjectUrl
        qr.dataset.ok = '1'
        qrRetryCount = 0
        if (box) box.classList.remove('is-error')
        if (hint) hint.textContent = '微信扫码参与本场'
      } catch (e) {
        qr.dataset.ok = '0'
        qrRetryCount += 1
        if (box) box.classList.add('is-error')
        const reason = (e && e.message) || '生成失败'
        if (hint) hint.textContent = qrRetryCount >= 3
          ? `${reason}；请检查微信 AppSecret 与小程序码权限`
          : `${reason}；4 秒后自动重试`
        setTimeout(() => {
          if (qr.dataset.ok !== '1') ensureQr(true)
        }, 4000)
      } finally {
        qr.dataset.loading = '0'
      }
    }

    function spawnLantern(p) {
      if (!p) return
      const stage = document.getElementById('lanternStage')
      if (!stage) return
      lanternInFlight += 1
      const el = document.createElement('div')
      el.className = 'lantern'
      const left = 4 + Math.random() * 82
      const dur = (10 + Math.random() * 5) / LANTERN_SPEED
      el.style.left = left + '%'
      el.style.animationDuration = dur.toFixed(2) + 's'
      el.innerHTML = `
        <img class="base" src="./assets/lantern.svg" alt="" />
        <img class="av" src="${escapeAttr(p.avatarUrl || './assets/prize-placeholder.svg')}" alt="" />
        <div class="nm">${escapeHtml(p.realName || p.nickName || '')}</div>`
      stage.appendChild(el)
      el.addEventListener('animationend', () => {
        el.remove()
        lanternInFlight = Math.max(0, lanternInFlight - 1)
      })
    }

    function spawnDanmaku(d) {
      if (!d) return false
      const fp = dmFingerprint(d)
      if (dmOnScreen.has(fp)) return false
      const layer = document.getElementById('dmLayer')
      if (!layer) return false
      dmOnScreen.add(fp)
      danmakuInFlight += 1
      dmLane = (dmLane + 1) % 9
      const el = document.createElement('div')
      el.className = 'dm'
      el.style.top = (12 + dmLane * 8) + 'vh'
      const dur = (14 + Math.random() * 6) / DM_SPEED
      el.style.animationDuration = dur.toFixed(2) + 's'
      const name = d.nickName || '嘉宾'
      const text = d.content != null ? d.content : ('签到上墙 · ' + (d.realName || name))
      el.innerHTML = `<img src="${escapeAttr(d.avatarUrl || './assets/prize-placeholder.svg')}" alt="" /><span><b>${escapeHtml(name)}</b>：${escapeHtml(text)}</span>`
      layer.appendChild(el)
      el.addEventListener('animationend', () => {
        el.remove()
        dmOnScreen.delete(fp)
        danmakuInFlight = Math.max(0, danmakuInFlight - 1)
      })
      return true
    }

    function tickLanterns() {
      if (document.getElementById('app').classList.contains('mode-checkin') === false) return
      if (lanternInFlight >= MAX_LANTERNS) return
      if (!lanternQueue.size()) return
      spawnLantern(lanternQueue.next())
    }

    function tickDanmaku() {
      if (danmakuInFlight >= MAX_DANMAKU) return
      if (!danmakuQueue.size()) return
      // 最多尝试队列长度次，跳过屏上已有的「同人同文」
      const tries = Math.max(1, danmakuQueue.size())
      for (let i = 0; i < tries; i++) {
        const next = danmakuQueue.next()
        if (!next) return
        if (spawnDanmaku(next)) return
      }
    }

    function ensureAnimLoops() {
      if (!lanternTimer) {
        lanternTimer = setInterval(tickLanterns, Math.round(1400 / LANTERN_SPEED))
        tickLanterns()
      }
      if (!danmakuTimer) {
        danmakuTimer = setInterval(tickDanmaku, Math.round(2600 / DM_SPEED))
        tickDanmaku()
      }
    }

    function syncAnimPools() {
      const parts = (snap && snap.participants) || []
      // 新签到优先：给较新的更高 _rank（列表通常新→旧，反转序号）
      const rankedParts = parts.map((p, i) => ({
        ...p,
        _rank: Number(p.id) || (parts.length - i),
      }))
      lanternQueue.sync(rankedParts)

      const dms = (snap && snap.danmaku) || []
      danmakuQueue.sync(dms.map((d) => ({ ...d, _rank: Number(d.id) || 0 })))
      // 签到也可作为弹幕素材，保证无人发弹幕时仍有飘屏
      if (!dms.length && rankedParts.length) {
        danmakuQueue.sync(
          rankedParts.map((p) => ({
            id: 'p' + p.id,
            nickName: p.nickName,
            avatarUrl: p.avatarUrl,
            content: (p.realName ? p.realName + ' · ' : '') + '已签到上墙',
            _rank: p._rank,
          }))
        )
      }
      ensureAnimLoops()
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/`/g, '&#96;')
    }

    function renderBlueSlots(winners, spinningNow) {
      const round = currentRound()
      const n = Math.max(1, Number((round && round.winnerCount) || (winners && winners.length) || 1))
      const prize = round && round.prize
      document.getElementById('blueTitle').textContent = spinningNow
        ? '正在抽奖'
        : (winners && winners.length ? '恭喜中奖' : prizeTitleOf(round))
      document.getElementById('bluePrizeLevel').textContent = (prize && prize.levelLabel) || '奖项'
      document.getElementById('bluePrizeName').textContent = (prize && prize.name) || ''
      document.getElementById('bluePrizeImg').src = (prize && prize.imageUrl) || './assets/prize-placeholder.svg'
      document.getElementById('blueRemain').textContent = '抽 ' + n
      const box = document.getElementById('blueSlots')
      const pool = snap.participants || []
      const cells = []
      for (let i = 0; i < Math.min(n, 5); i++) {
        if (spinningNow) {
          const p = pool[Math.floor(Math.random() * Math.max(pool.length, 1))] || {}
          cells.push(`<div class="slot"><div class="spinning">${escapeHtml((p.nickName || '?').slice(0, 1))}</div><div class="label">抽取中</div></div>`)
        } else if (winners && winners[i]) {
          const w = winners[i]
          cells.push(`<div class="slot"><img class="face" src="${w.avatarUrl || w.prizeItemImage || './assets/prize-placeholder.svg'}" alt="" /><div class="label">${escapeHtml(w.realName || w.nickName)}<small>${escapeHtml(w.prizeItemName || w.nickName || '')}</small></div></div>`)
        } else {
          cells.push(`<div class="slot"><div class="spinning">${i + 1}</div><div class="label">待揭晓</div></div>`)
        }
      }
      box.innerHTML = cells.join('')
    }

    function renderDark(winners) {
      const round = currentRound()
      const prize = round && round.prize
      document.getElementById('darkTitle').textContent =
        winners && winners.length ? '恭喜中奖' : prizeTitleOf(round)
      document.getElementById('darkSub').textContent = (prize && prize.levelLabel) || '奖项'
      document.getElementById('darkPrizeLevel').textContent = (prize && prize.levelLabel) || '奖项'
      document.getElementById('darkPrizeName').textContent = (prize && prize.name) || ''
      document.getElementById('darkPrizeImg').src = (prize && prize.imageUrl) || './assets/prize-placeholder.svg'
      const bg = document.getElementById('darkBg')
      bg.innerHTML = (snap.participants || []).slice(0, 42).map((p, i) => {
        return `<img src="${p.avatarUrl || './assets/prize-placeholder.svg'}" alt="" style="left:${(i * 17) % 95}%;top:${(i * 23) % 90}%" />`
      }).join('')
      document.getElementById('darkGrid').innerHTML = (winners || []).map((w) => `
        <div class="wcard">
          <img src="${w.avatarUrl || './assets/prize-placeholder.svg'}" alt="" />
          <div class="n">${escapeHtml(w.realName || w.nickName || '')}</div>
          <div class="nn">${escapeHtml(w.prizeItemName || w.nickName || '')}</div>
        </div>
      `).join('')
    }

    function showResult(winners) {
      const theme = (snap.event && snap.event.themeMode) || 'blue'
      if (theme === 'dark' || (winners && winners.length > 5)) {
        setMode('dark')
        renderDark(winners)
      } else {
        setMode('blue')
        renderBlueSlots(winners, false)
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    }

    async function applySnap(preferMode) {
      renderRounds()
      renderCheckinMeta()
      syncAnimPools()
      const mode = preferMode || (snap.event && snap.event.screenMode) || 'checkin'
      if (mode === 'result' || mode === 'draw') {
        const winners = snap.winners || []
        if (mode === 'draw' && !winners.length) {
          const theme = snap.event.themeMode === 'dark' ? 'dark' : 'blue'
          setMode(theme === 'dark' ? 'dark' : 'blue')
          if (theme === 'dark') renderDark([])
          else renderBlueSlots([], false)
        } else {
          showResult(winners)
        }
      } else {
        setMode('checkin')
      }
    }

    async function setScreenMode(mode, roundId) {
      if (!snap || !snap.event) return
      await fetch(`${API}/events/${snap.event.id}/screen-mode`, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
        body: JSON.stringify({ mode, roundId }),
      })
    }

    async function doDraw(redraw) {
      const round = currentRound()
      if (!round || !snap.event) return alert('请先在主办台新增奖项')
      if (spinning) return
      const ev = snap.event
      if (ev.status === 'closed') return alert('场次已关闭，无法抽奖')
      if (redraw && !ev.allowRedraw && !ev.testMode) return alert('本场已关闭重抽，请到主办台场次设置中开启')
      const tip = redraw
        ? (ev.testMode ? '确认重新抽取本轮测试结果？正式中奖不受影响。' : '确认重新抽取本轮？原正式中奖将作废。')
        : (ev.testMode
          ? `测试开奖：抽取 ${round.winnerCount} 人（不占正式名额）`
          : `正式开奖：抽取 ${round.winnerCount} 人，写入正式中奖名单`)
      if (!confirm(tip)) return
      spinning = true
      setMode('blue')
      await setScreenMode('draw', round.id)
      let ticks = 0
      const timer = setInterval(() => {
        renderBlueSlots([], true)
        ticks++
        if (ticks > 16) clearInterval(timer)
      }, 120)
      try {
        const path = redraw ? 'redraw' : 'draw'
        const res = await fetch(`${API}/events/${snap.event.id}/rounds/${round.id}/${path}`, {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: '{}',
        })
        const json = await res.json()
        clearInterval(timer)
        if (!res.ok || json.code) throw new Error(json.msg || '抽奖失败')
        await fetchSnap()
        showResult(json.data.winners || [])
      } catch (e) {
        clearInterval(timer)
        alert(e.message)
        setMode('checkin')
      } finally {
        spinning = false
      }
    }

    document.getElementById('roundSelect').onchange = async () => {
      const sel = document.getElementById('roundSelect')
      selectedRoundId = Number(sel.value) || sel.value
      const round = currentRound()
      if (!round || !snap || !snap.event) return
      try {
        const mode = snap.event.screenMode === 'checkin' ? 'draw' : (snap.event.screenMode || 'draw')
        await setScreenMode(mode, round.id)
        await fetchSnap()
        // 保持用户选择，不被服务端 currentRound 覆盖
        selectedRoundId = round.id
        document.getElementById('roundSelect').value = String(round.id)
        refreshDrawPanels()
        updateEventBrand()
      } catch (e) {
        alert(e.message || '切换奖项失败')
      }
    }
    document.getElementById('btnCheckin').onclick = async () => {
      await setScreenMode('checkin', selectedRoundId)
      await fetchSnap(); applySnap('checkin')
    }
    document.getElementById('btnDraw').onclick = () => doDraw(false)
    document.getElementById('btnRedraw').onclick = () => doDraw(true)
    document.getElementById('btnResult').onclick = async () => {
      const round = currentRound()
      await setScreenMode('result', round && round.id)
      await fetchSnap()
      selectedRoundId = round && round.id
      showResult(snap.winners || [])
    }

    async function loop() {
      try {
        await fetchSnap()
        setLoadBanner('')
        if (!spinning) await applySnap()
        else {
          syncAnimPools()
          updateEventBrand()
        }
      } catch (e) {
        console.warn(e)
        const reason = (e && e.message) || '请检查场次 code / 网络'
        document.getElementById('brand').textContent = '场次主题获取失败'
        document.getElementById('checkinKicker').textContent = '数据连接异常'
        document.getElementById('checkinTitle').textContent = '奖项暂不可用'
        document.getElementById('checkinSub').textContent = '请检查网络或从主办台重新打开大屏'
        setLoadBanner('大屏数据未取到：' + reason + ' · 场次 ' + code + ' · API ' + API)
      }
    }

    if (!code) {
      document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font-family:system-ui;padding:40px;text-align:center"><div><div style="font-size:14px;letter-spacing:.2em;opacity:.6;margin-bottom:12px">GALA SCREEN</div><div style="font-size:22px">缺少场次参数 code<br/>请从主办方后台「打开大屏」进入</div></div></div>'
    } else {
      loop()
      setInterval(loop, 2000)
    }
  </script>
</body>
</html>
