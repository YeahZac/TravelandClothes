<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>年会大屏</title>
  <style>
    :root { --gold: #f0d48a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #app { width: 100vw; height: 100vh; position: relative; }

    /* ===== 签到墙：红金灯笼 ===== */
    .mode-checkin {
      background:
        radial-gradient(circle at 50% 40%, #ffb35c 0%, transparent 42%),
        linear-gradient(180deg, #c4162a 0%, #8b0d1c 55%, #5a0812 100%);
      color: #fff;
    }
    .curtain-l, .curtain-r {
      position: absolute; top: 0; width: 18vw; height: 42vh;
      background: linear-gradient(180deg, #e1233a, #9a1020);
      opacity: .92; z-index: 2; pointer-events: none;
    }
    .curtain-l { left: 0; border-radius: 0 0 40% 0; }
    .curtain-r { right: 0; border-radius: 0 0 0 40%; }
    .checkin-title {
      position: absolute; top: 4vh; left: 0; right: 0; text-align: center;
      font-size: 3.2vw; font-weight: 800; letter-spacing: .12em; z-index: 5;
      text-shadow: 0 4px 18px rgba(0,0,0,.35);
    }
    .qr-box {
      position: absolute; top: 3vh; right: 3vw; z-index: 6;
      background: rgba(255,255,255,.95); padding: 12px; border-radius: 14px;
      text-align: center; color: #333; width: 160px;
    }
    .qr-box img { width: 130px; height: 130px; display: block; margin: 0 auto 6px; }
    .qr-box .t { font-size: 12px; }
    .lantern-stage { position: absolute; inset: 12vh 4vw 14vh; z-index: 3; overflow: hidden; }
    .lantern {
      position: absolute; width: 110px; text-align: center;
      animation: floatY 4s ease-in-out infinite;
    }
    .lantern img.base { width: 90px; height: auto; display: block; margin: 0 auto; }
    .lantern .av {
      width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
      border: 2px solid #ffe7a8; position: absolute; left: 50%; top: 58px;
      transform: translateX(-50%); background: #fff;
    }
    .lantern .nm {
      margin-top: -8px; font-size: 12px; color: #5a2a00; font-weight: 700;
      background: rgba(255,236,180,.9); border-radius: 8px; padding: 2px 6px;
      display: inline-block; max-width: 96px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    /* 弹幕 */
    .danmaku-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 8; }
    .dm {
      position: absolute; white-space: nowrap; display: flex; align-items: center; gap: 8px;
      padding: 6px 14px 6px 6px; border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(255,180,200,.75));
      color: #333; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
      animation: dmMove linear forwards;
    }
    .dm img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    @keyframes dmMove {
      from { transform: translateX(100vw); }
      to { transform: translateX(-120%); }
    }

    /* ===== 科技蓝抽奖 ===== */
    .mode-blue {
      background:
        radial-gradient(circle at 50% 20%, #1b4f9c 0%, transparent 45%),
        linear-gradient(180deg, #061433 0%, #020814 100%);
      color: #dff4ff;
    }
    .blue-title {
      position: absolute; top: 5vh; left: 0; right: 0; text-align: center; z-index: 4;
    }
    .blue-title .year {
      display: inline-block; padding: 8px 22px; border: 2px solid #5ecbff;
      border-radius: 12px; color: #7fe0ff; letter-spacing: .2em; margin-bottom: 10px;
    }
    .blue-title h1 {
      margin: 0; font-size: 3.4vw; letter-spacing: .2em;
      text-shadow: 0 0 24px rgba(80,200,255,.55);
    }
    .prize-chip {
      position: absolute; top: 4vh; right: 3vw; z-index: 6;
      display: flex; align-items: center; gap: 10px;
      background: rgba(8,24,56,.75); border: 1px solid #3d7dff;
      border-radius: 999px; padding: 8px 14px 8px 8px;
    }
    .prize-chip img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
    .slots {
      position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
      display: flex; gap: 2.5vw; z-index: 4;
    }
    .slot {
      width: 16vw; max-width: 240px; height: 22vw; max-height: 320px;
      background: url('./assets/box-glow.svg') center/contain no-repeat;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
    }
    .slot .face {
      width: 58%; aspect-ratio: 1; border-radius: 16px; object-fit: cover;
      border: 2px solid #b8ecff; background: #0a1a33;
    }
    .slot .label { margin-top: 10px; font-size: 1.1vw; color: #e8f7ff; text-align: center; }
    .slot .spinning { font-size: 4vw; font-weight: 800; color: #7fe0ff; text-shadow: 0 0 20px #3cf; }

    /* ===== 深色金结果 ===== */
    .mode-dark {
      background:
        radial-gradient(circle at 50% 0%, #2a2416 0%, transparent 40%),
        #0a0a0a;
      color: var(--gold);
    }
    .dark-bg-avatars {
      position: absolute; inset: 0; overflow: hidden; opacity: .25; z-index: 1;
    }
    .dark-bg-avatars img {
      position: absolute; width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
      filter: grayscale(.2);
    }
    .dark-head { position: absolute; top: 6vh; left: 0; right: 0; text-align: center; z-index: 4; }
    .dark-head h1 {
      margin: 0; font-size: 4vw; letter-spacing: .25em;
      background: linear-gradient(180deg, #fff6d0, #d4a84b); -webkit-background-clip: text;
      color: transparent;
    }
    .dark-head .sub {
      margin-top: 12px; display: inline-block; padding: 0 24px;
      border-top: 1px solid #c9a227; border-bottom: 1px solid #c9a227;
      letter-spacing: .3em; font-size: 1.3vw;
    }
    .winner-grid {
      position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
      display: flex; flex-wrap: wrap; gap: 1.6vw; justify-content: center;
      width: min(86vw, 1200px); z-index: 4;
    }
    .wcard {
      width: 11vw; min-width: 110px; text-align: center;
    }
    .wcard img {
      width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px;
      border: 2px solid #c9a227; background: #1a1a1a;
    }
    .wcard .n { margin-top: 8px; color: #fff; font-size: 1.05vw; }
    .wcard .nn { color: #bba56a; font-size: .85vw; }

    /* 控场条 */
    .ctrl {
      position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%);
      z-index: 20; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      background: rgba(0,0,0,.45); padding: 10px 14px; border-radius: 999px;
      backdrop-filter: blur(8px);
    }
    .ctrl button, .ctrl select {
      border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
      background: linear-gradient(90deg, #ff5f8f, #6a7bff); color: #fff; font-weight: 700;
    }
    .ctrl select { background: #1c2438; color: #fff; }
    .ctrl .ghost { background: rgba(255,255,255,.12); }
    .hidden { display: none !important; }
    .brand {
      position: absolute; top: 3vh; left: 3vw; z-index: 6; font-size: 14px; opacity: .8;
    }
  </style>
</head>
<body>
  <div id="app" class="mode-checkin">
    <div class="brand" id="brand">海川全民优享助手 · 年会大屏</div>

    <!-- 签到 -->
    <div id="panel-checkin">
      <div class="curtain-l"></div>
      <div class="curtain-r"></div>
      <div class="checkin-title" id="checkinTitle">扫码签到上墙</div>
      <div class="qr-box">
        <img id="qrImg" alt="签到码" />
        <div class="t">请扫码参与活动</div>
        <div class="t" id="codeLabel"></div>
      </div>
      <div class="lantern-stage" id="lanternStage"></div>
    </div>

    <!-- 科技蓝 -->
    <div id="panel-blue" class="hidden">
      <div class="blue-title">
        <div class="year" id="blueYear">GALAXY</div>
        <h1 id="blueTitle">正在抽奖</h1>
      </div>
      <div class="prize-chip" id="blueChip">
        <img id="bluePrizeImg" src="./assets/prize-placeholder.svg" alt="" />
        <div>
          <div id="bluePrizeLevel">奖项</div>
          <div style="font-size:12px;opacity:.8" id="bluePrizeName"></div>
        </div>
        <div style="margin-left:8px;background:#2a4d9c;padding:4px 10px;border-radius:999px;font-size:12px" id="blueRemain">抽 0 名</div>
      </div>
      <div class="slots" id="blueSlots"></div>
    </div>

    <!-- 深色金 -->
    <div id="panel-dark" class="hidden">
      <div class="dark-bg-avatars" id="darkBg"></div>
      <div class="dark-head">
        <h1 id="darkTitle">恭喜中奖</h1>
        <div class="sub" id="darkSub">奖项</div>
      </div>
      <div class="prize-chip" id="darkChip" style="border-color:#c9a227;background:rgba(30,24,10,.8)">
        <img id="darkPrizeImg" src="./assets/prize-placeholder.svg" alt="" />
        <div>
          <div id="darkPrizeLevel">奖项</div>
          <div style="font-size:12px;opacity:.8" id="darkPrizeName"></div>
        </div>
      </div>
      <div class="winner-grid" id="darkGrid"></div>
    </div>

    <div class="danmaku-layer" id="dmLayer"></div>

    <div class="ctrl" id="ctrl">
      <select id="roundSelect"></select>
      <button type="button" id="btnCheckin">签到墙</button>
      <button type="button" id="btnDraw">开始抽奖</button>
      <button type="button" class="ghost" id="btnRedraw">重新抽奖</button>
      <button type="button" class="ghost" id="btnResult">看结果</button>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search)
    const code = (qs.get('code') || '').toUpperCase()
    const screenToken = qs.get('token') || localStorage.getItem('gala_screen_token') || ''
    if (screenToken) localStorage.setItem('gala_screen_token', screenToken)
    const API = '/api/gala/v1'
    let snap = null
    let lastDmId = 0
    let spinning = false

    function authHeaders() {
      const h = {}
      if (screenToken) h.Authorization = 'Bearer ' + screenToken
      return h
    }

    async function fetchSnap() {
      const res = await fetch(`${API}/screen/snapshot?code=${encodeURIComponent(code)}`)
      const json = await res.json()
      if (!res.ok || json.code) throw new Error(json.msg || '加载失败')
      snap = json.data
      return snap
    }

    function setMode(ui) {
      const app = document.getElementById('app')
      app.classList.remove('mode-checkin', 'mode-blue', 'mode-dark')
      document.getElementById('panel-checkin').classList.add('hidden')
      document.getElementById('panel-blue').classList.add('hidden')
      document.getElementById('panel-dark').classList.add('hidden')
      if (ui === 'checkin') {
        app.classList.add('mode-checkin')
        document.getElementById('panel-checkin').classList.remove('hidden')
      } else if (ui === 'blue') {
        app.classList.add('mode-blue')
        document.getElementById('panel-blue').classList.remove('hidden')
      } else {
        app.classList.add('mode-dark')
        document.getElementById('panel-dark').classList.remove('hidden')
      }
    }

    function currentRound() {
      if (!snap) return null
      const sel = document.getElementById('roundSelect').value
      if (sel) return (snap.rounds || []).find((r) => String(r.id) === String(sel)) || snap.currentRound
      return snap.currentRound || (snap.rounds && snap.rounds[0]) || null
    }

    function renderRounds() {
      const sel = document.getElementById('roundSelect')
      const rounds = snap.rounds || []
      sel.innerHTML = rounds.map((r) => {
        const label = (r.prize && r.prize.levelLabel) || ('轮次' + r.roundNo)
        const n = r.winnerCount
        return `<option value="${r.id}">${label} · 抽${n}人</option>`
      }).join('')
      if (snap.currentRound) sel.value = String(snap.currentRound.id)
    }

    function renderCheckin() {
      document.getElementById('checkinTitle').textContent = (snap.event && snap.event.title) || '扫码签到上墙'
      document.getElementById('codeLabel').textContent = '场次 ' + (snap.event && snap.event.code)
      document.getElementById('qrImg').src = `${API}/screen/qrcode?code=${encodeURIComponent(code)}&_=${Date.now()}`
      const stage = document.getElementById('lanternStage')
      const list = (snap.participants || []).slice(0, 36)
      stage.innerHTML = list.map((p, i) => {
        const left = 4 + (i * 17) % 90
        const top = 8 + ((i * 29) % 70)
        const delay = (i % 6) * 0.35
        return `<div class="lantern" style="left:${left}%;top:${top}%;animation-delay:${delay}s">
          <img class="base" src="./assets/lantern.svg" alt="" />
          <img class="av" src="${p.avatarUrl || './assets/prize-placeholder.svg'}" alt="" />
          <div class="nm">${escapeHtml(p.realName || p.nickName || '')}</div>
        </div>`
      }).join('')
    }

    function renderBlueSlots(winners, spinningNow) {
      const round = currentRound()
      const n = Math.max(1, Number((round && round.winnerCount) || (winners && winners.length) || 1))
      const prize = round && round.prize
      document.getElementById('blueTitle').textContent = spinningNow ? '正在抽奖' : (winners && winners.length ? '恭喜中奖' : '准备抽奖')
      document.getElementById('bluePrizeLevel').textContent = (prize && prize.levelLabel) || '奖项'
      document.getElementById('bluePrizeName').textContent = (prize && prize.name) || ''
      document.getElementById('bluePrizeImg').src = (prize && prize.imageUrl) || './assets/prize-placeholder.svg'
      document.getElementById('blueRemain').textContent = '抽 ' + n + ' 名'
      const box = document.getElementById('blueSlots')
      const pool = snap.participants || []
      const cells = []
      for (let i = 0; i < Math.min(n, 5); i++) {
        if (spinningNow) {
          const p = pool[Math.floor(Math.random() * Math.max(pool.length, 1))] || {}
          cells.push(`<div class="slot"><div class="spinning">${(p.nickName || '?').slice(0,1)}</div><div class="label">抽取中</div></div>`)
        } else if (winners && winners[i]) {
          const w = winners[i]
          cells.push(`<div class="slot"><img class="face" src="${w.avatarUrl || './assets/prize-placeholder.svg'}" /><div class="label">${escapeHtml(w.realName || w.nickName)}<br/><span style="opacity:.7;font-size:12px">${escapeHtml(w.nickName || '')}</span></div></div>`)
        } else {
          cells.push(`<div class="slot"><div class="spinning">${i + 1}</div><div class="label">待揭晓</div></div>`)
        }
      }
      box.innerHTML = cells.join('')
    }

    function renderDark(winners) {
      const round = currentRound()
      const prize = round && round.prize
      document.getElementById('darkSub').textContent = (prize && prize.levelLabel) || '奖项'
      document.getElementById('darkPrizeLevel').textContent = (prize && prize.levelLabel) || '奖项'
      document.getElementById('darkPrizeName').textContent = (prize && prize.name) || ''
      document.getElementById('darkPrizeImg').src = (prize && prize.imageUrl) || './assets/prize-placeholder.svg'
      const bg = document.getElementById('darkBg')
      bg.innerHTML = (snap.participants || []).slice(0, 40).map((p, i) => {
        return `<img src="${p.avatarUrl || './assets/prize-placeholder.svg'}" style="left:${(i*17)%95}%;top:${(i*23)%90}%" />`
      }).join('')
      const grid = document.getElementById('darkGrid')
      const list = winners || []
      grid.innerHTML = list.map((w) => `
        <div class="wcard">
          <img src="${w.avatarUrl || './assets/prize-placeholder.svg'}" alt="" />
          <div class="n">${escapeHtml(w.realName || w.nickName || '')}</div>
          <div class="nn">${escapeHtml(w.nickName || '')}</div>
        </div>
      `).join('')
    }

    function showResult(winners) {
      const theme = (snap.event && snap.event.themeMode) || 'blue'
      if (theme === 'dark' || (winners && winners.length > 5)) {
        setMode('dark')
        renderDark(winners)
      } else {
        setMode('blue')
        renderBlueSlots(winners, false)
      }
    }

    function pushDanmaku(items) {
      const layer = document.getElementById('dmLayer')
      ;(items || []).forEach((d) => {
        if (d.id <= lastDmId) return
        lastDmId = Math.max(lastDmId, d.id)
        const el = document.createElement('div')
        el.className = 'dm'
        el.style.top = (12 + Math.random() * 70) + 'vh'
        el.style.animationDuration = (8 + Math.random() * 8) + 's'
        el.innerHTML = `<img src="${d.avatarUrl || './assets/prize-placeholder.svg'}" /><span><b>${escapeHtml(d.nickName)}</b>：${escapeHtml(d.content)}</span>`
        layer.appendChild(el)
        el.addEventListener('animationend', () => el.remove())
      })
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    }

    async function applySnap(preferMode) {
      renderRounds()
      renderCheckin()
      pushDanmaku(snap.danmaku || [])
      const mode = preferMode || (snap.event && snap.event.screenMode) || 'checkin'
      if (mode === 'result' || mode === 'draw') {
        const winners = snap.winners || []
        if (mode === 'draw' && !winners.length) {
          const theme = snap.event.themeMode === 'dark' ? 'dark' : 'blue'
          setMode(theme === 'dark' ? 'dark' : 'blue')
          if (theme === 'dark') renderDark([])
          else renderBlueSlots([], false)
        } else {
          showResult(winners)
        }
      } else {
        setMode('checkin')
      }
    }

    async function setScreenMode(mode, roundId) {
      if (!snap || !snap.event) return
      await fetch(`${API}/events/${snap.event.id}/screen-mode`, {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
        body: JSON.stringify({ mode, roundId }),
      })
    }

    async function doDraw(redraw) {
      const round = currentRound()
      if (!round || !snap.event) return alert('请先配置奖项轮次')
      if (spinning) return
      spinning = true
      const theme = snap.event.themeMode === 'dark' ? 'dark' : 'blue'
      setMode(theme === 'dark' ? 'blue' : 'blue') // 滚动统一用蓝盒动效，结果再切
      await setScreenMode('draw', round.id)
      let ticks = 0
      const timer = setInterval(() => {
        renderBlueSlots([], true)
        ticks++
        if (ticks > 16) clearInterval(timer)
      }, 120)
      try {
        const path = redraw ? 'redraw' : 'draw'
        const res = await fetch(`${API}/events/${snap.event.id}/rounds/${round.id}/${path}`, {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: '{}',
        })
        const json = await res.json()
        clearInterval(timer)
        if (!res.ok || json.code) throw new Error(json.msg || '抽奖失败')
        await fetchSnap()
        showResult(json.data.winners || [])
      } catch (e) {
        clearInterval(timer)
        alert(e.message)
        setMode('checkin')
      } finally {
        spinning = false
      }
    }

    document.getElementById('btnCheckin').onclick = async () => {
      await setScreenMode('checkin')
      await fetchSnap(); applySnap('checkin')
    }
    document.getElementById('btnDraw').onclick = () => doDraw(false)
    document.getElementById('btnRedraw').onclick = () => {
      if (confirm('确认重新抽取本轮？原中奖将作废')) doDraw(true)
    }
    document.getElementById('btnResult').onclick = async () => {
      await fetchSnap()
      showResult(snap.winners || [])
      await setScreenMode('result', currentRound() && currentRound().id)
    }

    async function loop() {
      try {
        await fetchSnap()
        if (!spinning) await applySnap()
        else pushDanmaku(snap.danmaku || [])
      } catch (e) {
        console.warn(e)
      }
    }

    if (!code) {
      document.body.innerHTML = '<div style="color:#fff;padding:40px;font-size:20px">缺少场次参数 code，请从主办方后台「打开大屏」进入</div>'
    } else {
      loop()
      setInterval(loop, 2000)
    }
  </script>
</body>
</html>
