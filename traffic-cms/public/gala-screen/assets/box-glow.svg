<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340" viewBox="0 0 300 340" fill="none">
  <defs>
    <linearGradient id="frame" x1="150" y1="20" x2="150" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EE7FF"/>
      <stop offset="1" stop-color="#2B6BFF" stop-opacity=".7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="150" cy="310" rx="100" ry="16" fill="#3AA0FF" opacity=".4" filter="url(#glow)"/>
  <rect x="36" y="24" width="228" height="260" rx="32" fill="url(#frame)" stroke="#D6F6FF" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="54" y="42" width="192" height="224" rx="22" fill="#061428" fill-opacity=".55"/>
  <rect x="70" y="58" width="160" height="180" rx="16" stroke="#7EE7FF" stroke-opacity=".25" stroke-width="1"/>
</svg>
