<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>海川年会抽奖 · 主办方</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Hallmark · genre: modern-minimal · macrostructure: Workbench · theme: Cobalt
     * tone: utilitarian · nav: N9 · footer: Ft2 · enrichment: none
     * pre-emit critique: P4 H5 E4 S4 R4 V4
     */
    :root {
      --color-paper: oklch(98.5% 0.006 250);
      --color-paper-2: oklch(96% 0.01 250);
      --color-paper-3: #fff;
      --color-rule: oklch(88% 0.012 250);
      --color-muted: oklch(52% 0.02 250);
      --color-ink: oklch(22% 0.03 255);
      --color-accent: oklch(52% 0.19 255);
      --color-accent-soft: oklch(94% 0.04 255);
      --color-danger: oklch(52% 0.18 25);
      --color-focus: oklch(55% 0.2 255);
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 40px;
      --radius: 6px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 160ms;
    }
    html, body { overflow-x: clip; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--color-ink);
      background:
        linear-gradient(90deg, transparent 79px, var(--color-rule) 79px, var(--color-rule) 80px, transparent 80px),
        var(--color-paper);
      background-size: 80px 100%;
    }
    .shell { max-width: 1120px; margin: 0 auto; padding: var(--space-xl) var(--space-lg) 96px; }
    .topbar {
      display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-md);
      margin-bottom: var(--space-xl); padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-rule);
    }
    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.35rem, 2vw, 1.75rem);
      letter-spacing: -0.03em;
      font-style: normal;
      margin: 0;
    }
    .brand span { color: var(--color-accent); }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin: 0 0 6px;
    }
    .panel {
      background: var(--color-paper-3);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius);
      padding: var(--space-lg);
      margin-bottom: var(--space-md);
    }
    .panel h2, .panel h3 {
      font-family: var(--font-display);
      font-style: normal;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 var(--space-md);
    }
    .panel h2 { font-size: 1.15rem; }
    .panel h3 { font-size: 0.95rem; }
    label {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin: 0 0 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-rule);
      border-radius: var(--radius);
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 14px;
      transition: border-color var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out);
    }
    input:hover, select:hover, textarea:hover { border-color: oklch(75% 0.03 250); }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }
    .grid { display: grid; gap: var(--space-md); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-md); }
    button {
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 10px 16px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform var(--dur) var(--ease-out), background var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out);
    }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--color-accent); color: oklch(98% 0.01 250); }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost { background: transparent; border-color: var(--color-rule); color: var(--color-ink); }
    .btn-ghost:hover { background: var(--color-paper-2); }
    .btn-danger { background: transparent; border-color: color-mix(in oklch, var(--color-danger) 40%, var(--color-rule)); color: var(--color-danger); }
    .btn-danger:hover { background: color-mix(in oklch, var(--color-danger) 8%, white); }
    .muted { color: var(--color-muted); font-size: 13px; line-height: 1.5; }
    .list-row {
      display: flex; justify-content: space-between; align-items: center; gap: var(--space-md);
      padding: 14px 0;
      border-bottom: 1px solid var(--color-rule);
    }
    .list-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .list-row:first-child { padding-top: 0; }
    .pill {
      display: inline-flex; align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--color-accent-soft);
      color: var(--color-accent);
      letter-spacing: 0.04em;
    }
    .prize {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: var(--space-md);
      padding: var(--space-md);
      border: 1px solid var(--color-rule);
      border-radius: var(--radius);
      background: var(--color-paper);
    }
    .prize img {
      width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius);
      background: var(--color-paper-2); border: 1px solid var(--color-rule);
    }
    .prize-list { display: grid; gap: var(--space-sm); }
    .hidden { display: none !important; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
      background: var(--color-ink); color: var(--color-paper);
      padding: 10px 16px; border-radius: 999px; font-size: 13px;
      opacity: 0; pointer-events: none;
      transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .foot {
      margin-top: var(--space-xl);
      padding-top: var(--space-md);
      border-top: 1px solid var(--color-rule);
      font-size: 12px;
      color: var(--color-muted);
      display: flex; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap;
    }
    @media (max-width: 768px) {
      .grid-2, .grid-4 { grid-template-columns: 1fr; }
      .shell { padding: var(--space-lg) var(--space-md) 80px; }
      body { background: var(--color-paper); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Haichuan Gala Console</p>
        <h1 class="brand">年会抽奖 <span>主办台</span></h1>
      </div>
      <p class="muted" id="topMeta">短信登录 · 多场次 · 大屏控场</p>
    </header>

    <section id="view-login" class="panel">
      <h2>登录 / 注册</h2>
      <p class="muted" style="margin-top:-8px;margin-bottom:16px">一个手机号一个账号，验证码通过后即可建场开抽。</p>
      <div class="grid grid-2">
        <div>
          <label for="phone">手机号</label>
          <input id="phone" maxlength="11" placeholder="11 位手机号" autocomplete="tel" />
        </div>
        <div>
          <label for="smsCode">验证码</label>
          <input id="smsCode" maxlength="6" placeholder="6 位验证码" inputmode="numeric" />
        </div>
        <div>
          <label for="displayName">称呼</label>
          <input id="displayName" placeholder="如：张经理" />
        </div>
        <div>
          <label for="company">公司 / 组织</label>
          <input id="company" placeholder="选填" />
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn-ghost" id="btnSend">获取验证码</button>
        <button type="button" class="btn-primary" id="btnLogin">进入主办台</button>
      </div>
      <p class="muted" style="margin-top:14px">未配置短信时可用开发码 <span class="pill">888888</span></p>
    </section>

    <section id="view-home" class="hidden">
      <div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <div>
          <p class="eyebrow">Signed in</p>
          <div id="who" style="font-family:var(--font-display);font-weight:600;font-size:1.1rem"></div>
          <p class="muted" style="margin:4px 0 0">可管理多场次活动</p>
        </div>
        <button type="button" class="btn-ghost" id="btnLogout">退出</button>
      </div>

      <div class="panel">
        <h2>新建场次</h2>
        <div class="grid grid-2">
          <div>
            <label for="newTitle">场次标题</label>
            <input id="newTitle" placeholder="如：2026 年终盛典抽奖" />
          </div>
          <div>
            <label for="newRequireName">真实姓名</label>
            <select id="newRequireName">
              <option value="0">签到时选填</option>
              <option value="1">签到时必填</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn-primary" id="btnCreate">创建场次</button>
        </div>
      </div>

      <div class="panel">
        <h2>我的场次</h2>
        <div id="eventList" class="muted">加载中…</div>
      </div>
    </section>

    <section id="view-event" class="hidden">
      <div class="panel">
        <div class="actions" style="margin-top:0;margin-bottom:12px">
          <button type="button" class="btn-ghost" id="btnBack">返回列表</button>
        </div>
        <h2 id="evTitle" style="margin-bottom:6px"></h2>
        <p class="muted" id="evMeta"></p>
        <div class="actions">
          <button type="button" class="btn-primary" id="btnOpenScreen">打开大屏</button>
          <button type="button" class="btn-ghost" id="btnSyncRounds">同步轮次</button>
          <button type="button" class="btn-ghost" id="btnToggleName">切换姓名必填</button>
        </div>
      </div>

      <div class="panel">
        <h3>奖品编辑</h3>
        <input type="hidden" id="prizeId" />
        <div class="grid grid-2">
          <div><label for="pLevel">等级文案</label><input id="pLevel" placeholder="一等奖 / 幸运奖" /></div>
          <div><label for="pName">奖品名称</label><input id="pName" placeholder="实物或礼品名" /></div>
          <div><label for="pValue">价值文案</label><input id="pValue" placeholder="选填，如 ¥5999" /></div>
          <div>
            <label for="pShowValue">是否展示价值</label>
            <select id="pShowValue"><option value="0">不展示</option><option value="1">展示</option></select>
          </div>
          <div><label for="pCount">抽取人数</label><input id="pCount" type="number" min="1" value="1" /></div>
          <div><label for="pSort">排序</label><input id="pSort" type="number" value="0" /></div>
          <div><label for="pImage">图片 URL</label><input id="pImage" placeholder="上传后自动填入" /></div>
          <div><label for="pFile">上传图片</label><input id="pFile" type="file" accept="image/*" /></div>
        </div>
        <div class="actions">
          <button type="button" class="btn-primary" id="btnSavePrize">保存奖品</button>
          <button type="button" class="btn-ghost" id="btnResetPrize">清空表单</button>
        </div>
      </div>

      <div class="panel">
        <h3>奖品列表</h3>
        <div class="prize-list" id="prizeList"></div>
      </div>
    </section>

    <footer class="foot">
      <span>海川全民优享助手 · 年会抽奖</span>
      <span>API 可通过 ?api= 指定后端域名</span>
    </footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    function resolveApiBase() {
      const qs = new URLSearchParams(location.search)
      const fromQuery = (qs.get('api') || '').replace(/\/$/, '')
      if (fromQuery) {
        try { localStorage.setItem('gala_api_origin', fromQuery) } catch (_) {}
        return fromQuery + '/api/gala/v1'
      }
      let saved = ''
      try { saved = (localStorage.getItem('gala_api_origin') || '').replace(/\/$/, '') } catch (_) {}
      if (saved) return saved + '/api/gala/v1'
      return '/api/gala/v1'
    }
    const API = resolveApiBase()
    const TOKEN_KEY = 'gala_host_token'
    let token = localStorage.getItem(TOKEN_KEY) || ''
    let account = null
    let currentEvent = null

    function toast(msg) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.classList.add('show')
      clearTimeout(toast._t)
      toast._t = setTimeout(() => el.classList.remove('show'), 2600)
    }

    async function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {})
      if (token) headers.Authorization = 'Bearer ' + token
      const res = await fetch(API + path, Object.assign({}, opts, { headers }))
      const json = await res.json().catch(() => ({}))
      if (!res.ok || json.code) throw new Error(json.msg || ('HTTP ' + res.status))
      return json.data
    }

    function show(id) {
      ;['view-login', 'view-home', 'view-event'].forEach((x) => {
        document.getElementById(x).classList.toggle('hidden', x !== id)
      })
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;') }

    async function refreshMe() {
      if (!token) return show('view-login')
      try {
        const data = await api('/auth/me')
        account = data.account
        document.getElementById('who').textContent = (account.displayName || '主办方') + ' · ' + account.phone
        document.getElementById('topMeta').textContent = account.company || '已登录'
        show('view-home')
        await loadEvents()
      } catch (e) {
        token = ''
        localStorage.removeItem(TOKEN_KEY)
        show('view-login')
      }
    }

    async function loadEvents() {
      const data = await api('/events')
      const box = document.getElementById('eventList')
      if (!data.list.length) {
        box.innerHTML = '<p class="muted">还没有场次。上方创建第一场即可。</p>'
        return
      }
      box.innerHTML = data.list.map((ev) => `
        <div class="list-row">
          <div>
            <div style="font-family:var(--font-display);font-weight:600">${escapeHtml(ev.title)} <span class="pill">${escapeHtml(ev.code)}</span></div>
            <div class="muted">奖项 ${ev.prizeCount} · ${ev.themeMode === 'dark' ? '深色金大屏' : '科技蓝大屏'} · 姓名${ev.requireRealName ? '必填' : '选填'}</div>
          </div>
          <button type="button" class="btn-primary btn-open" data-id="${ev.id}">管理</button>
        </div>
      `).join('')
      box.querySelectorAll('.btn-open').forEach((btn) => {
        btn.onclick = () => openEvent(Number(btn.dataset.id))
      })
    }

    async function openEvent(id) {
      const data = await api('/events/' + id)
      currentEvent = data.event
      document.getElementById('evTitle').textContent = currentEvent.title
      document.getElementById('evMeta').textContent =
        `场次码 ${currentEvent.code} · 奖项 ${currentEvent.prizeCount} · ${currentEvent.themeMode === 'dark' ? '深色金主题' : '科技蓝主题'} · 姓名${currentEvent.requireRealName ? '必填' : '选填'}`
      renderPrizes(data.prizes || [])
      show('view-event')
    }

    function renderPrizes(list) {
      const box = document.getElementById('prizeList')
      if (!list.length) {
        box.innerHTML = '<p class="muted">暂无奖品，请先保存一档奖项。</p>'
        return
      }
      box.innerHTML = list.map((p) => `
        <div class="prize">
          <img src="${escapeAttr(p.imageUrl || '/gala-screen/assets/prize-placeholder.svg')}" alt="" />
          <div>
            <div style="font-family:var(--font-display);font-weight:600">${escapeHtml(p.levelLabel)} · ${escapeHtml(p.name)}</div>
            <div class="muted">抽 ${p.winnerCount} 人${p.showValue && p.valueText ? ' · ' + escapeHtml(p.valueText) : ''}</div>
            <div class="actions">
              <button type="button" class="btn-ghost btn-edit" data-json='${escapeAttr(JSON.stringify(p))}'>编辑</button>
              <button type="button" class="btn-danger btn-del" data-id="${p.id}">删除</button>
            </div>
          </div>
        </div>
      `).join('')
      box.querySelectorAll('.btn-edit').forEach((btn) => {
        btn.onclick = () => {
          const p = JSON.parse(btn.dataset.json)
          document.getElementById('prizeId').value = p.id
          document.getElementById('pLevel').value = p.levelLabel
          document.getElementById('pName').value = p.name
          document.getElementById('pValue').value = p.valueText || ''
          document.getElementById('pShowValue').value = p.showValue ? '1' : '0'
          document.getElementById('pCount').value = p.winnerCount
          document.getElementById('pSort').value = p.sortOrder
          document.getElementById('pImage').value = p.imageUrl || ''
        }
      })
      box.querySelectorAll('.btn-del').forEach((btn) => {
        btn.onclick = async () => {
          if (!confirm('确认删除该奖品？')) return
          await api(`/events/${currentEvent.id}/prizes/${btn.dataset.id}`, { method: 'DELETE' })
          toast('已删除')
          openEvent(currentEvent.id)
        }
      })
    }

    document.getElementById('btnSend').onclick = async () => {
      try {
        const phone = document.getElementById('phone').value.trim()
        const data = await api('/auth/sms/send', { method: 'POST', body: JSON.stringify({ phone }) })
        toast(data.hint || '验证码已发送')
      } catch (e) { toast(e.message) }
    }
    document.getElementById('btnLogin').onclick = async () => {
      try {
        const data = await api('/auth/sms/login', {
          method: 'POST',
          body: JSON.stringify({
            phone: document.getElementById('phone').value.trim(),
            code: document.getElementById('smsCode').value.trim(),
            displayName: document.getElementById('displayName').value.trim(),
            company: document.getElementById('company').value.trim(),
          }),
        })
        token = data.token
        localStorage.setItem(TOKEN_KEY, token)
        account = data.account
        toast('登录成功')
        refreshMe()
      } catch (e) { toast(e.message) }
    }
    document.getElementById('btnLogout').onclick = () => {
      token = ''
      localStorage.removeItem(TOKEN_KEY)
      show('view-login')
    }
    document.getElementById('btnCreate').onclick = async () => {
      try {
        const ev = await api('/events', {
          method: 'POST',
          body: JSON.stringify({
            title: document.getElementById('newTitle').value.trim(),
            requireRealName: document.getElementById('newRequireName').value === '1',
          }),
        })
        toast('场次已创建')
        openEvent(ev.id)
      } catch (e) { toast(e.message) }
    }
    document.getElementById('btnBack').onclick = () => { show('view-home'); loadEvents() }
    document.getElementById('btnOpenScreen').onclick = async () => {
      try {
        const data = await api(`/events/${currentEvent.id}/screen-token`, { method: 'POST', body: '{}' })
        const qs = new URLSearchParams(location.search)
        const apiOrigin = (qs.get('api') || localStorage.getItem('gala_api_origin') || '').replace(/\/$/, '')
        let screenUrl = data.screenUrl || `/gala-screen/?code=${encodeURIComponent(currentEvent.code)}`
        if (!/^https?:\/\//i.test(screenUrl)) {
          screenUrl = location.origin + (screenUrl.startsWith('/') ? screenUrl : '/' + screenUrl)
        }
        const u = new URL(screenUrl)
        if (apiOrigin) u.searchParams.set('api', apiOrigin)
        if (data.screenToken) u.searchParams.set('token', data.screenToken)
        window.open(u.toString(), '_blank')
      } catch (e) { toast(e.message) }
    }
    document.getElementById('btnSyncRounds').onclick = async () => {
      try {
        await api(`/events/${currentEvent.id}/sync-rounds`, { method: 'POST', body: '{}' })
        toast('轮次已同步')
      } catch (e) { toast(e.message) }
    }
    document.getElementById('btnToggleName').onclick = async () => {
      try {
        await api(`/events/${currentEvent.id}`, {
          method: 'PUT',
          body: JSON.stringify({ requireRealName: !currentEvent.requireRealName }),
        })
        openEvent(currentEvent.id)
      } catch (e) { toast(e.message) }
    }
    document.getElementById('btnResetPrize').onclick = () => {
      ;['prizeId','pLevel','pName','pValue','pImage'].forEach((id) => { document.getElementById(id).value = '' })
      document.getElementById('pShowValue').value = '0'
      document.getElementById('pCount').value = '1'
      document.getElementById('pSort').value = '0'
    }
    document.getElementById('btnSavePrize').onclick = async () => {
      try {
        const body = {
          id: document.getElementById('prizeId').value ? Number(document.getElementById('prizeId').value) : undefined,
          levelLabel: document.getElementById('pLevel').value.trim(),
          name: document.getElementById('pName').value.trim(),
          valueText: document.getElementById('pValue').value.trim(),
          showValue: document.getElementById('pShowValue').value === '1',
          winnerCount: Number(document.getElementById('pCount').value) || 1,
          sortOrder: Number(document.getElementById('pSort').value) || 0,
          imageUrl: document.getElementById('pImage').value.trim(),
        }
        await api(`/events/${currentEvent.id}/prizes`, { method: 'PUT', body: JSON.stringify(body) })
        toast('奖品已保存')
        document.getElementById('btnResetPrize').click()
        openEvent(currentEvent.id)
      } catch (e) { toast(e.message) }
    }
    document.getElementById('pFile').onchange = async (e) => {
      const file = e.target.files && e.target.files[0]
      if (!file || !currentEvent) return
      const fd = new FormData()
      fd.append('file', file)
      try {
        const res = await fetch(`${API}/events/${currentEvent.id}/upload`, {
          method: 'POST',
          headers: token ? { Authorization: 'Bearer ' + token } : {},
          body: fd,
        })
        const json = await res.json()
        if (!res.ok || json.code) throw new Error(json.msg || '上传失败')
        document.getElementById('pImage').value = json.data.url || json.data.path
        toast('图片已上传')
      } catch (err) { toast(err.message) }
    }

    refreshMe()
  </script>
</body>
</html>
